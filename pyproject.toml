# Workspace root — NOT a package.
#
# This file exists so `rfdb-core` (the shared library) and the service backends
# resolve as one uv workspace: a single root `uv.lock` and a single `.venv`, so
# an edit to rfdb-core is picked up by every member without a reinstall.
#
# There is deliberately no `[project]` table: the repo root ships no code. uv
# calls this a *virtual* workspace root.
#
[tool.uv.workspace]
members = ["rfdb-core", "curator-backend", "dataexplorer-backend"]

# ---------------------------------------------------------------------------
# Ruff — one config for the whole repo
# ---------------------------------------------------------------------------
# It lives at the root so every workspace member is linted by identical rules
# from a single source of truth. Ruff finds this by
# walking up from each file (a pyproject.toml without [tool.ruff] is not a
# config boundary), so `uv run ruff check .` works from the root or any member.
[tool.ruff]
line-length = 100
target-version = "py311"

# Required now that the config sits at the repo root instead of inside a service.
# Ruff's isort infers first-party packages from `src`; left at its default (the
# config's own directory) it would resolve to the repo root, where `core`, `api`,
# `models` and `scripts` are not top-level — so it would classify them as
# third-party and demand they merge into the fastapi/rdflib import block. Listing
# the member roots keeps the existing three-group import order intact.
src = ["curator-backend", "dataexplorer-backend", "rfdb-core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
