# docker-compose.yml
#
# Development stack for RossijskijFeatrDB.
#
# Dev-only flags (--reload, source bind-mounts) live here.  Production is
# docker-compose.prod.yml, a separate file rather than an override of this one,
# so a setting that must hold in both belongs in both.
#
# Usage:
#   docker compose up --build          # first run or after Dockerfile changes
#   docker compose up                  # subsequent runs
#   docker compose down -v             # tear down including named volumes
#
# ---------------------------------------------------------------------------
# TWO MODES, selected by Compose profile
# ---------------------------------------------------------------------------
# The reader/writer boundary is a *service* boundary, so which kind of instance
# this is becomes a deploy-time choice with no code change:
#
#   docker compose up                  # READ mode — 4 services, no editor
#   docker compose --profile full up   # FULL mode — + curator-backend/-frontend
#
# Default: READ. With no --profile flag and an empty or missing
# COMPOSE_PROFILES in .env, Compose activates no profile.
#
# Base services carry **no `profiles:` key**, so read mode needs no flag. Only
# `curator-*` are `full`-only.
#
# ⚠ EXISTING CHECKOUTS: `docker compose up` no longer starts the editor. Put
#   COMPOSE_PROFILES=full
# in your repo-root .env to get the whole stack back on a bare `up` — that is
# what scripts/env-init.sh now writes for a fresh checkout, and it refuses to
# overwrite an existing .env, so this one line is a manual add.
#
# ⚠ INVARIANT when editing: every `depends_on` target must be a BASE service.
# No dependency may cross into an inactive profile — Compose versions disagree
# on whether that auto-activates the profile or hard-errors. `curator-frontend`
# depending on `curator-backend` is fine (both `full`); nothing base may depend
# on anything `full`.

# ---------------------------------------------------------------------------
# Shared values, defined once and aliased into each service that needs them.
# ---------------------------------------------------------------------------

# Per-shape read-only policy: shape URIs whose records cannot be edited. Language
# data is reference vocabulary managed externally; curators browse it only.
#
# **Both backends must receive the identical value** (decision D11). The curator
# enforces it on writes; the reader needs it because both services serve the same
# shape catalogue, `readOnly` flags included, and the editor now fetches that
# catalogue from the reader so it can start with the write tier down.
#
# The anchor is the point: with two literals, editing one and forgetting the other
# would hand clients different flags depending on which service they asked — the
# same class of bug (C20) this arrangement exists to remove, but quieter, because
# both services would be individually self-consistent.
x-read-only-shapes: &read_only_shapes '["https://rosfeatr.eu/rdf/schema/LanguageShape"]'

# Base IRIs, identical for both backends for the same reason: the writer mints
# records and file nodes under DATA_BASE_URI, and the reader serves them and
# recovers their local ids from it. Override both in a root .env to use other
# namespaces. See the .env.example files for where each one ends up.
x-data-base-uri: &data_base_uri "${DATA_BASE_URI:-https://rosfeatr.eu/rdf/data/}"
x-schema-base-uri: &schema_base_uri "${SCHEMA_BASE_URI:-https://rosfeatr.eu/rdf/schema/}"

services:

  # --------------------------------------------------------------------------
  # Oxigraph — RDF triple store
  # --------------------------------------------------------------------------
  oxigraph:
    # Pinned to a specific release so `docker compose pull` never silently
    # breaks the SPARQL / Graph Store Protocol API contract.
    # Update deliberately and re-run `docker compose up --build`.
    image: oxigraph/oxigraph:0.5.7
    container_name: rfdb-oxigraph
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - oxigraph_data:/data
    # No `command:` override — the Dockerfile already sets
    # CMD ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    # via ENTRYPOINT + CMD.  Repeating it here would be redundant.
    healthcheck:
      # The final image is gcr.io/distroless/cc-debian12 — no shell,
      # no wget, no curl.  The only executable available is the oxigraph
      # binary itself (ENTRYPOINT /usr/local/bin/oxigraph).
      # `CMD oxigraph --help` resolves to ENTRYPOINT + ["--help"], exits
      # 0 immediately, and proves the process is alive.
      # This is a LIVENESS check only — it does not verify the HTTP port.
      # HTTP readiness is handled in curator-backend/app.py's lifespan, which
      # polls TripleStore.health() before any reset/seed call.
      test: ["CMD", "/usr/local/bin/oxigraph", "--help"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --------------------------------------------------------------------------
  # Garage — S3-compatible object storage (source PDF scans)
  # --------------------------------------------------------------------------
  # A fresh volume comes up empty: no layout, bucket, or key exist yet, and
  # none can be declared in garage.toml. Run `scripts/garage-init.sh` ONCE
  # after the first `up` (or after `down -v`) to bootstrap them — it is
  # idempotent. See that script's header for the why and when.
  garage:
    # Pinned like oxigraph:0.5.7 so `docker compose pull` can't shift the S3
    # API out from under curator-backend. This image is distroless (only the
    # /garage binary, no shell) — that's why bootstrap runs from the host.
    image: dxflrs/garage:v1.0.1
    container_name: rfdb-garage
    restart: unless-stopped
    environment:
      # Read by Garage because garage.toml omits `rpc_secret` (no secret in git).
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      # S3 API published on localhost for dev REPL / curl round-trips.
      # RPC (3901) stays internal — never published.
      - "3900:3900"
    healthcheck:
      # Distroless image: no shell/curl. `garage status` execs the binary
      # directly (exec form, no shell), reads /etc/garage.toml + the RPC
      # secret, and exits 0 once the local node's RPC is serving. Liveness
      # for the RPC layer; the init script re-checks `status` itself before
      # bootstrapping.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --------------------------------------------------------------------------
  # Curator backend — FastAPI + uvicorn (the ONLY service that writes)
  # --------------------------------------------------------------------------
  # `full` profile: a read-only instance does not deploy the write tier at all,
  # which is what makes read mode a deployment choice rather than a per-route
  # 403. Orthogonal to READ_ONLY below — that freezes a *deployed* writer.
  curator-backend:
    build:
      context: .
      dockerfile: curator-backend/Dockerfile
    container_name: rfdb-curator-backend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      oxigraph:
        # service_healthy waits for the oxigraph liveness check (process
        # alive) before starting curator-backend.  Its own startup
        # retry loop (see lifespan in app.py) then waits for the HTTP
        # port to be ready before seeding, giving a two-layer readiness
        # guarantee without needing tools inside the Oxigraph image.
        condition: service_healthy
      garage:
        # Wait for Garage's RPC to be up. The boto3 client connects
        # lazily, so this only orders startup — a fresh volume still needs a
        # one-time `scripts/garage-init.sh` before uploads work.
        condition: service_healthy
    environment:
      # Which TripleStore implementation to build; matches the code default and
      # docker-compose.prod.yml.
      TRIPLESTORE: oxigraph
      # Docker-internal hostname — only used inside the container network.
      OXIGRAPH_URL: http://oxigraph:7878
      DATA_GRAPH_URI: "https://rosfeatr.eu/rdf/graph/"
      DATA_BASE_URI: *data_base_uri
      SCHEMA_BASE_URI: *schema_base_uri
      # Read timeout (seconds) for bulk Turtle loads. The ~38 MB Glottolog
      # vocab below needs well over Oxigraph's default; raise if you add
      # larger seed files.
      OXIGRAPH_LOAD_TIMEOUT: "${OXIGRAPH_LOAD_TIMEOUT:-300}"
      # Paths inside the container, mapped by the volumes block below.
      SCHEMA_PATH: /app/schema/schema.ttl
      VOCAB_PATH: '["/app/data/vocab.ttl", "/app/data/glottolog_language.ttl"]'
      DATA_PATH: /app/data/data.ttl
      # Set true only when you want a full store wipe on restart (dev/test).
      # Must be false in production — data loss is irreversible.
      RESET_DATA_ON_STARTUP: "${RESET_DATA_ON_STARTUP:-false}"
      # Vocab must always be seeded so the store is never empty.
      # Set false only if you are managing vocabulary loading manually.
      SEED_VOCAB_ON_STARTUP: "true"
      # Test fixture data — dev/test only, must be false in production.
      SEED_TEST_DATA_ON_STARTUP: "${SEED_TEST_DATA_ON_STARTUP:-false}"
      # Object storage (Garage) for source PDF scans. garage-internal hostname;
      # creds are the predefined key imported by scripts/garage-init.sh.
      S3_ENDPOINT: "http://garage:3900"
      S3_REGION: garage
      S3_BUCKET: "${S3_BUCKET:-sources}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      # Per-file upload ceiling (MB); 0 disables the cap.
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-500}"
      # Demo mode: block all write/delete API routes when true. Genuinely
      # writer-only — the reader has no writes to disable, so it has no mode.
      READ_ONLY: "${READ_ONLY:-false}"
      # Shared with dataexplorer-backend via the anchor at the top of this file.
      READ_ONLY_SHAPES: *read_only_shapes
      # NOT needed by this stack's own frontends: they issue same-origin
      # requests through the Vite proxy, so nothing here has to be edited to
      # browse the stack from another host. This list is for clients that do go
      # cross-origin — a frontend dev server run on the host rather than in
      # Compose, or a third-party consumer of the API.
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost"]'
      # Structured JSON-lines log file written inside the container.
      # Persisted in the curator_backend_logs named volume mounted at /app/logs.
      LOG_FILE: logs/app.jsonl
      LOG_LEVEL: INFO
      # Keep crash/restart history, but truncate once when a fresh container is created.
      TRUNCATE_LOG_ON_STARTUP: "false"
      TRUNCATE_LOG_ON_FRESH_CONTAINER_START: "true"
    volumes:
      # Source bind-mount for hot-reload in development.
      # Safe with this Dockerfile: pip installs packages into the system
      # Python's site-packages (/usr/local/lib/python3.12/site-packages),
      # NOT into /app, so the bind-mount does not shadow any installed
      # dependencies.  If you switch to a virtualenv inside /app (e.g.
      # /app/.venv), move it outside /app or protect it with an anonymous
      # volume, otherwise the bind-mount will shadow it.
      - ./curator-backend:/app
      # The shared library, hot-reloadable on the same terms as the service
      # code above. Mounted at the path the image installed it from (editable,
      # so the .pth in site-packages resolves through here) — NOT under /app,
      # which the previous mount replaces wholesale.
      - ./rfdb-core:/opt/rfdb-core
      # Read-only mounts for schema and data files.
      # The container runs as appuser (uid 1001); ensure host files are
      # world-readable (chmod o+r) if your umask is restrictive.
      - ./schema:/app/schema:ro
      - ./data:/app/data:ro
      # Persist JSON-lines logs in a Docker-managed volume to avoid
      # host uid/gid permission issues on first deploy.
      - curator_backend_logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # --reload is a dev-only flag enabling uvicorn's file-watcher.
    # docker-compose.prod.yml runs without it: it adds overhead and is not safe
    # in production.
    #
    # --reload-dir is required, not decorative: passing it at all replaces
    # uvicorn's default (watch the cwd), so /app must be listed explicitly.
    # Without the second entry an edit to rfdb-core would not restart the
    # process, and the service would keep serving the previously imported
    # version of the shared library with no visible sign of it.
    command:
      [
        "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000",
        "--reload", "--reload-dir", "/app", "--reload-dir", "/opt/rfdb-core",
      ]

  # --------------------------------------------------------------------------
  # Data Explorer backend — FastAPI + uvicorn, reads only
  # --------------------------------------------------------------------------
  # Same store, same bucket, no write path. It does NOT depend on
  # curator-backend: that independence is the point of the split, and the
  # read-only deploy mode runs this service with no writer present at all.
  #
  # It also does not wait for the store to be reachable — an unreachable store is
  # a per-request condition here (503 / empty results), not a startup failure, so
  # blocking on it would only make the reader less available. Contrast
  # curator-backend, which must not begin clearing and seeding against a store
  # that may drop mid-operation.
  dataexplorer-backend:
    build:
      context: .
      dockerfile: dataexplorer-backend/Dockerfile
    container_name: rfdb-dataexplorer-backend
    restart: unless-stopped
    depends_on:
      oxigraph:
        condition: service_healthy
      garage:
        # Only orders startup: the boto3 client connects lazily, and this service
        # tolerates storage being absent (GET /api/v1/dataexplorer/meta/files
        # reports configured: false rather than erroring).
        condition: service_healthy
    environment:
      # Must match curator-backend's OXIGRAPH_URL and DATA_GRAPH_URI, or this
      # service will correctly report an empty store.
      TRIPLESTORE: oxigraph
      OXIGRAPH_URL: http://oxigraph:7878
      DATA_GRAPH_URI: "https://rosfeatr.eu/rdf/graph/"
      DATA_BASE_URI: *data_base_uri
      SCHEMA_BASE_URI: *schema_base_uri
      SCHEMA_PATH: /app/schema/schema.ttl
      # No OXIGRAPH_LOAD_TIMEOUT: it bounds bulk Turtle loads, and this service
      # never loads any.
      #
      # No VOCAB_PATH / DATA_PATH / RESET_DATA_ON_STARTUP / SEED_* / READ_ONLY /
      # MAX_UPLOAD_MB: every one of those is a write concern, and this service's
      # Settings does not define them.
      #
      # READ_ONLY_SHAPES *is* here, from the same anchor the curator uses (D11). It
      # looks like a write concern and was filed as one, which is precisely the
      # mistake: it states which shapes are editable, so any client needs it to
      # render a UI. Withholding it meant the editor could only get the flags from
      # the writer, and therefore showed nothing whenever the writer was down (C20).
      READ_ONLY_SHAPES: *read_only_shapes
      S3_ENDPOINT: "http://garage:3900"
      S3_REGION: garage
      S3_BUCKET: "${S3_BUCKET:-sources}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      # NOT needed by this stack's own frontends: they issue same-origin
      # requests through the Vite proxy, so nothing here has to be edited to
      # browse the stack from another host. This list is for clients that do go
      # cross-origin — a frontend dev server run on the host rather than in
      # Compose, or a third-party consumer of the API.
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost"]'
      LOG_FILE: logs/app.jsonl
      LOG_LEVEL: INFO
      TRUNCATE_LOG_ON_STARTUP: "false"
      TRUNCATE_LOG_ON_FRESH_CONTAINER_START: "true"
    volumes:
      - ./dataexplorer-backend:/app
      # The shared library, hot-reloadable — see the curator-backend service for
      # why this is mounted at /opt and why the install is editable.
      - ./rfdb-core:/opt/rfdb-core
      # Schema only. No ./data mount: the reader never loads a seed file, so
      # giving it the seed data would just be an unused mount that implies
      # otherwise.
      - ./schema:/app/schema:ro
      - dataexplorer_backend_logs:/app/logs
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    command:
      [
        "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001",
        "--reload", "--reload-dir", "/app", "--reload-dir", "/opt/rfdb-core",
      ]

  # --------------------------------------------------------------------------
  # Frontend — Vite dev server
  # --------------------------------------------------------------------------
  curator-frontend:
    build:
      context: .
      dockerfile: curator-frontend/Dockerfile
      # Explicit, because this Dockerfile now also has a `production` stage and
      # Docker defaults to the LAST stage when no target is given.
      target: development
    container_name: rfdb-curator-frontend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      curator-backend:
        # Frontend starts only after curator-backend /health is reachable so the
        # app does not appear "up" while API startup failed.
        condition: service_healthy
      dataexplorer-backend:
        # The editor reads from :8001 (every list/get/search/counts/meta call and
        # the whole shape catalogue), so it genuinely depends on the reader too.
        # A base service, so this never crosses into an inactive profile.
        condition: service_healthy
    environment:
      # ----------------------------------------------------------------------
      # NO browser-facing base URLs here — that is the design, not an omission
      # ----------------------------------------------------------------------
      # In dev the client uses relative URLs (src/api/client.js) and the Vite
      # dev server proxies them by prefix, exactly as proxy/Caddyfile does in
      # production. So every request goes to the origin that served the page and
      # nothing in this file has to know where that is: the stack works
      # unchanged on localhost, on a LAN IP, through an SSH tunnel, or behind a
      # domain, and the app's own frontends need no CORS_ORIGINS entry.
      #
      # This block used to set VITE_API_BASE / VITE_READ_API_BASE /
      # VITE_EXPLORER_BASE to http://localhost:*, which silently broke every
      # non-local deployment: a remote dev host served the bundle, and the
      # browser then resolved the reads against *its own* machine. Set them
      # again only for a build whose backend genuinely lives on another origin —
      # and add the matching CORS_ORIGINS entry there when you do.
      #
      # The Explorer deep link ("Open in Explorer" on a selected record) is a
      # true cross-origin case in dev, since that app publishes on port 80 while
      # this one is on 5173. The client derives it from the browser's own
      # hostname; VITE_EXPLORER_BASE still overrides.

      # ----------------------------------------------------------------------
      # Internal proxy targets (Vite dev server → backend containers)
      # ----------------------------------------------------------------------
      # Used ONLY by the Vite development server running inside this container.
      #
      # IMPORTANT:
      # - Run inside Docker → must use Docker DNS (service names)
      # - Never use localhost here (would point to this container itself)
      #
      # Two targets because the editor spans both tiers: it writes through
      # curator-backend and reads through dataexplorer-backend. D8 made that a
      # prefix split (/api/v1/curator vs /api/v1/dataexplorer), which is what
      # lets one dev server route both.
      #
      # Example:
      #   Browser → /api/v1/curator/… → Vite → http://curator-backend:8000/…
      #
      VITE_PROXY_TARGET: http://curator-backend:8000
      VITE_READ_PROXY_TARGET: http://dataexplorer-backend:8001
    volumes:
      - ./curator-frontend:/app
      # The anonymous volume re-surfaces the node_modules layer built by
      # `npm ci` during `docker build` on top of the bind-mount.  Docker
      # applies anonymous volumes after bind-mounts, so the image's
      # node_modules (correct OS/arch binaries) always win over any
      # node_modules that may exist on the host.
      - /app/node_modules
    ports:
      - "5173:5173"

  # --------------------------------------------------------------------------
  # Explorer — read-only graph visualizer (Vite dev server)
  # --------------------------------------------------------------------------
  # A pure frontend: it talks only to a backend's /api. Deployable standalone
  # (point VITE_API_BASE at any read service that exposes /api/v1/dataexplorer);
  # here it rides the dev stack and proxies the reader's prefixes to
  # dataexplorer-backend. It
  # depends on the reader, not the curator — the explorer issues nothing but reads, which is what lets it keep
  # working with the write tier stopped.
  graphexplorer-frontend:
    build:
      context: .
      dockerfile: graphexplorer-frontend/Dockerfile
      # See curator-frontend: the Dockerfile has a `production` stage as well.
      target: development
    container_name: rfdb-graphexplorer-frontend
    restart: unless-stopped
    depends_on:
      dataexplorer-backend:
        condition: service_healthy
    environment:
      # No browser-facing base URLs, same as curator-frontend and for the same
      # reason: the client is relative in dev and the Vite server proxies
      # /api/v1/dataexplorer and /rdf onward by prefix, so requests follow
      # whatever origin served the page.
      #
      # Vite dev-server proxy target (inside Docker → service name, not localhost).
      VITE_PROXY_TARGET: http://dataexplorer-backend:8001
      # Branding only — the graphexplorer-frontend code is domain-agnostic.
      VITE_APP_TITLE: RFDB Explorer
    volumes:
      - ./graphexplorer-frontend:/app
      # Anonymous volume keeps the image's node_modules over the bind-mount
      # (correct OS/arch binaries), same rationale as the curator-frontend service.
      - /app/node_modules
    ports:
      # Host-facing port is 80 so the explorer is reachable at
      # http://localhost with no port suffix, matching how a browser would hit
      # it in production. The Vite dev server itself still binds 5174 inside
      # the container (vite.config.js server.port) — it runs as the non-root
      # `node` user (see Dockerfile), which cannot bind port 80 directly, so
      # this is a Docker port *mapping*, not a server-side listen change.
      - "80:5174"

# ------------------------------------------------------------------------------
# Named volumes
# ------------------------------------------------------------------------------
volumes:
  oxigraph_data:
    # Persists RDF data across container restarts.
    # Run `docker compose down -v` to destroy it along with all containers.
  curator_backend_logs:
    # Persists curator-backend JSON-lines logs across container restarts.
  dataexplorer_backend_logs:
    # Same, for the read service. Separate volume so the two services' access
    # logs stay separable — they answer different halves of the API.
  garage_meta:
    # Garage cluster metadata (layout, buckets, keys). Destroyed by
    # `down -v` — after which you must re-run scripts/garage-init.sh.
  garage_data:
    # Garage object data (the stored PDF bytes).
